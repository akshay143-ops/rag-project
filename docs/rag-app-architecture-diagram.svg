<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">RAG App Architecture Diagram</title>
  <desc id="desc">High-level architecture and data flow for the Streamlit RAG learning application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .label { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .text { font: 16px Arial, sans-serif; fill: #1e293b; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; }
      .process { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 16; }
      .store { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 16; }
      .model { fill: #faf5ff; stroke: #9333ea; stroke-width: 2; rx: 16; }
      .guard { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 16; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .note { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="label">RAG Learning App Architecture</text>
  <text x="700" y="76" text-anchor="middle" class="small">Streamlit UI + conversation memory + security + query rewriting + ChromaDB retrieval + Gemini generation</text>

  <rect x="60" y="130" width="220" height="110" class="box"/>
  <text x="170" y="165" text-anchor="middle" class="label">User</text>
  <text x="170" y="195" text-anchor="middle" class="text">Asks a question</text>
  <text x="170" y="218" text-anchor="middle" class="small">Browser input</text>

  <rect x="340" y="130" width="240" height="110" class="box"/>
  <text x="460" y="165" text-anchor="middle" class="label">Streamlit UI</text>
  <text x="460" y="195" text-anchor="middle" class="text">app.py</text>
  <text x="460" y="218" text-anchor="middle" class="small">Displays chat, sources, scores</text>

  <rect x="640" y="130" width="260" height="110" class="process"/>
  <text x="770" y="165" text-anchor="middle" class="label">RAG Pipeline</text>
  <text x="770" y="195" text-anchor="middle" class="text">rag_pipeline.py</text>
  <text x="770" y="218" text-anchor="middle" class="small">Coordinates each step</text>

  <rect x="960" y="130" width="250" height="110" class="guard"/>
  <text x="1085" y="165" text-anchor="middle" class="label">Input Security</text>
  <text x="1085" y="195" text-anchor="middle" class="text">security.py</text>
  <text x="1085" y="218" text-anchor="middle" class="small">Validate and sanitize query</text>

  <rect x="80" y="330" width="250" height="110" class="process"/>
  <text x="205" y="365" text-anchor="middle" class="label">Conversation Memory</text>
  <text x="205" y="395" text-anchor="middle" class="text">conversation.py</text>
  <text x="205" y="418" text-anchor="middle" class="small">Recent user/assistant turns</text>

  <rect x="390" y="330" width="250" height="110" class="process"/>
  <text x="515" y="365" text-anchor="middle" class="label">Query Rewrite</text>
  <text x="515" y="395" text-anchor="middle" class="text">workflow.py</text>
  <text x="515" y="418" text-anchor="middle" class="small">Clarifies vague follow-ups</text>

  <rect x="700" y="330" width="250" height="110" class="process"/>
  <text x="825" y="365" text-anchor="middle" class="label">Embeddings</text>
  <text x="825" y="395" text-anchor="middle" class="text">embeddings.py</text>
  <text x="825" y="418" text-anchor="middle" class="small">Text to vector representation</text>

  <rect x="1010" y="330" width="250" height="110" class="store"/>
  <text x="1135" y="365" text-anchor="middle" class="label">Vector Store</text>
  <text x="1135" y="395" text-anchor="middle" class="text">vector_store.py</text>
  <text x="1135" y="418" text-anchor="middle" class="small">ChromaDB similarity search</text>

  <rect x="1010" y="520" width="250" height="110" class="store"/>
  <text x="1135" y="555" text-anchor="middle" class="label">Source Documents</text>
  <text x="1135" y="585" text-anchor="middle" class="text">data_loader.py</text>
  <text x="1135" y="608" text-anchor="middle" class="small">Python, ML, DB, API, AI docs</text>

  <rect x="700" y="520" width="250" height="110" class="guard"/>
  <text x="825" y="555" text-anchor="middle" class="label">Filtering</text>
  <text x="825" y="585" text-anchor="middle" class="text">filters.py</text>
  <text x="825" y="608" text-anchor="middle" class="small">Drop weak matches or fallback</text>

  <rect x="390" y="520" width="250" height="110" class="model"/>
  <text x="515" y="555" text-anchor="middle" class="label">Gemini Model</text>
  <text x="515" y="585" text-anchor="middle" class="text">google-genai API</text>
  <text x="515" y="608" text-anchor="middle" class="small">Generate grounded answer</text>

  <rect x="80" y="520" width="250" height="110" class="guard"/>
  <text x="205" y="555" text-anchor="middle" class="label">Monitoring</text>
  <text x="205" y="585" text-anchor="middle" class="text">monitoring.py</text>
  <text x="205" y="608" text-anchor="middle" class="small">Confidence and grounding check</text>

  <rect x="390" y="730" width="250" height="110" class="box"/>
  <text x="515" y="765" text-anchor="middle" class="label">Final Response</text>
  <text x="515" y="795" text-anchor="middle" class="text">Answer + sources</text>
  <text x="515" y="818" text-anchor="middle" class="small">Shown in Streamlit chat</text>

  <rect x="760" y="730" width="360" height="110" class="note"/>
  <text x="940" y="762" text-anchor="middle" class="label">Graceful Failure Paths</text>
  <text x="940" y="792" text-anchor="middle" class="text">Unsafe input is blocked early</text>
  <text x="940" y="816" text-anchor="middle" class="text">No relevant docs returns fallback</text>

  <path d="M 280 185 L 340 185" class="arrow"/>
  <path d="M 580 185 L 640 185" class="arrow"/>
  <path d="M 900 185 L 960 185" class="arrow"/>
  <path d="M 1085 240 L 1085 290 L 770 290 L 770 240" class="arrow"/>

  <path d="M 680 240 L 205 330" class="arrow"/>
  <path d="M 770 240 L 515 330" class="arrow"/>
  <path d="M 640 385 L 700 385" class="arrow"/>
  <path d="M 950 385 L 1010 385" class="arrow"/>
  <path d="M 1135 520 L 1135 440" class="dash"/>
  <path d="M 1010 395 L 950 555" class="arrow"/>
  <path d="M 700 575 L 640 575" class="arrow"/>
  <path d="M 390 575 L 330 575" class="arrow"/>
  <path d="M 205 630 L 515 730" class="arrow"/>
  <path d="M 515 730 L 460 240" class="arrow"/>
  <path d="M 700 600 L 760 760" class="dash"/>
  <path d="M 960 225 L 940 730" class="dash"/>

  <text x="310" y="176" text-anchor="middle" class="small">query</text>
  <text x="610" y="176" text-anchor="middle" class="small">run_rag()</text>
  <text x="930" y="176" text-anchor="middle" class="small">validate</text>
  <text x="995" y="281" text-anchor="middle" class="small">safe query</text>
  <text x="468" y="302" text-anchor="middle" class="small">history context</text>
  <text x="670" y="374" text-anchor="middle" class="small">rewritten query</text>
  <text x="980" y="374" text-anchor="middle" class="small">query vector</text>
  <text x="990" y="512" text-anchor="middle" class="small">retrieved docs</text>
  <text x="665" y="564" text-anchor="middle" class="small">filtered context</text>
  <text x="360" y="564" text-anchor="middle" class="small">answer</text>
  <text x="365" y="696" text-anchor="middle" class="small">scored answer</text>
</svg>
